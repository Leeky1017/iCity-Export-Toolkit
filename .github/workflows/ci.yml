name: Tests
on:
  push:
    branches: [main, 'task/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile icity_export.py icity_native.py
  ci:
    if: always()
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - env:
          TEST_RESULT: ${{ needs.tests.result }}
        run: test "$TEST_RESULT" = success
  merge-serial:
    needs: ci
    concurrency:
      group: merge-serial
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - run: echo 'All offline regression tests passed.'
